<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VMH neuropeptide atlas</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Newsreader:opsz,wght@6..72,500&display=swap" rel="stylesheet">
<style>
/* layout idea: a fixed three-column workbench (gene list, view, gene card); every view answers "where is this gene" */
:root {
  --bg: #f1f3ef; --surface: #fcfcfb; --ink: #14181a; --muted: #586063; --line: #dadfd9;
  --accent: #1c5cab; --accent-soft: #e2ecf9; --zero: #d6d9d4; --mark: #a86a00;
  --display: "Newsreader", Georgia, serif;
  --body: "IBM Plex Sans", "Segoe UI", Helvetica, Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #141716; --surface: #1c201e; --ink: #eceeea; --muted: #a2aaa5; --line: #303633;
    --accent: #7db2f0; --accent-soft: #1d2d42; --zero: #3b413e; --mark: #e6ad3c; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #141716; --surface: #1c201e; --ink: #eceeea; --muted: #a2aaa5; --line: #303633;
  --accent: #7db2f0; --accent-soft: #1d2d42; --zero: #3b413e; --mark: #e6ad3c; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--body); display: flex; flex-direction: column; }
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 22px; padding: 12px 18px 10px; border-bottom: 1px solid var(--line); background: var(--surface); }
h1 { font: 500 22px/1.1 var(--display); margin: 0; letter-spacing: .005em; text-wrap: balance; }
header p { margin: 0; color: var(--muted); font-size: 12.5px; }
nav { margin-left: auto; display: flex; gap: 4px; }
button, select, input { font: inherit; color: inherit; }
.tab, .seg button { background: none; border: 1px solid transparent; border-radius: 6px; padding: 5px 11px; cursor: pointer; color: var(--muted); }
.tab[aria-current="page"], .seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--ink); border-color: var(--line); font-weight: 500; }
.tab:hover, .seg button:hover { color: var(--ink); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
main { flex: 1; min-height: 0; display: grid; grid-template-columns: 228px minmax(0, 1fr) 356px; gap: 12px; padding: 12px 18px 16px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; min-height: 0; display: flex; flex-direction: column; }
.panel > h2 { font: 600 11px/1 var(--body); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); margin: 0; padding: 12px 14px 8px; }
.scroll { overflow: auto; min-height: 0; flex: 1; }
/* gene list */
#gl-head { padding: 0 10px 8px; display: flex; flex-direction: column; gap: 8px; }
.seg { display: flex; gap: 2px; flex-wrap: wrap; }
.seg button { padding: 3px 9px; font-size: 12.5px; }
.seg button:disabled { opacity: .45; cursor: not-allowed; text-decoration: line-through; }
.seg button:disabled:hover { color: var(--muted); }
.note { color: var(--muted); font-size: 12.5px; }
.jump { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 2px 8px; font-size: 12.5px; cursor: pointer; margin-left: 4px; }
.jump:hover { border-color: var(--accent); }
.tab.doc { border-color: var(--line); color: var(--ink); margin-left: 10px; }
.tab.doc:hover { border-color: var(--accent); }
/* documentation view: the article fills the page, the gene list and the gene card step aside */
main.docmode { grid-template-columns: minmax(0, 1fr); }
main.docmode #genes, main.docmode #detail { display: none; }
#doc { display: grid; grid-template-columns: 200px minmax(0, 760px); gap: 36px; justify-content: center; padding: 26px 26px 70px; font-size: 15.5px; line-height: 1.6; }
#doc #toc { display: block; margin: 0; position: sticky; top: 26px; align-self: start; font-size: 13.5px; }
#doc #toc b { display: block; font: 600 11px/1 var(--body); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
#doc #toc button { display: block; width: 100%; text-align: left; padding: 3px 0; border: 0; background: none; color: var(--muted); cursor: pointer; }
#doc #toc button:hover { color: var(--accent); }
#doc article { min-width: 0; }
#doc h1 { font: 500 31px/1.15 var(--display); margin: 0 0 6px; text-wrap: balance; }
#doc h2 { font: 500 23px/1.2 var(--display); margin: 38px 0 8px; padding-top: 14px; border-top: 1px solid var(--line); scroll-margin-top: 8px; }
#doc h3 { font: 600 15.5px/1.3 var(--body); margin: 22px 0 4px; }
#doc p { margin: 8px 0; }
#doc .lede { color: var(--muted); font-size: 16.5px; }
#doc a { color: var(--accent); }
#doc ul { padding-left: 20px; margin: 8px 0; }
#doc li { margin: 3px 0; }
#doc code { font: 13px var(--mono); background: var(--bg); padding: 1px 5px; border-radius: 4px; }
#doc .tscroll { overflow-x: auto; margin: 12px 0; }
#doc table { border-collapse: collapse; font-size: 13.5px; width: 100%; }
#doc th, #doc td { text-align: left; padding: 5px 10px 5px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
#doc th { position: static; background: none; z-index: auto; font-weight: 600; font-size: 12.5px; color: var(--muted); white-space: nowrap; }
#doc td.n, #doc th.n { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 12.5px; white-space: nowrap; }
#doc figure { margin: 18px 0; }
#doc figure img { width: 100%; height: auto; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
#doc figcaption { color: var(--muted); font-size: 13px; margin-top: 6px; }
#doc .callout { background: var(--accent-soft); border-radius: 6px; padding: 10px 14px; margin: 14px 0; }
#doc .small { color: var(--muted); font-size: 13px; }
#q { width: 100%; padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); }
.gene { display: grid; grid-template-columns: 1fr 56px 34px; align-items: center; gap: 8px; width: 100%; padding: 4px 12px; border: 0; background: none; text-align: left; cursor: pointer; }
.gene:hover { background: var(--bg); }
.gene[aria-pressed="true"] { background: var(--accent-soft); }
.gene i { font-style: italic; }
.gene .dot, #gl-key .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-left: 6px; vertical-align: middle; }
#gl-key { color: var(--muted); font-size: 11.5px; margin: -2px 2px 0; }
#gl-key .dot { margin: 0 5px 0 0; }
.gene .bar { height: 6px; border-radius: 3px; background: var(--zero); overflow: hidden; }
.gene .bar b { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 12px; text-align: right; color: var(--muted); }
/* view */
#toolbar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); }
#toolbar label { color: var(--muted); font-size: 12.5px; margin-right: 4px; }
select { padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
.step { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 3px 9px; cursor: pointer; }
#stage { position: relative; flex: 1; min-height: 300px; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
#tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--surface); padding: 6px 9px; border-radius: 5px; font-size: 12px; line-height: 1.4; width: max-content; max-width: 270px; display: none; z-index: 2; }
#tip b { font-weight: 600; }
#tip .dim { opacity: .72; }
#ring { position: absolute; pointer-events: none; border-radius: 50%; border: 1.5px solid var(--ink); box-shadow: 0 0 0 1.5px var(--surface); display: none; z-index: 1; }
/* every legend and caption variant sits in one grid cell, so the footer (and with it the map) keeps its size when the view is switched */
#mapfoot { display: grid; }
#mapfoot > div { grid-area: 1 / 1; min-width: 0; }
#mapfoot > div[aria-hidden="true"] { visibility: hidden; }
.hid { visibility: hidden; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; padding: 8px 14px 4px; font-size: 12.5px; color: var(--muted); }
.legend .sw { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
.legend .ln { display: inline-block; width: 16px; height: 0; border-top: 2px solid; margin-right: 5px; vertical-align: 3px; }
.legend .ramp { display: inline-block; width: 120px; height: 9px; border-radius: 4px; vertical-align: -1px; margin: 0 6px; }
.caption { padding: 2px 14px 10px; font-size: 12.5px; color: var(--muted); }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 3px 10px; cursor: pointer; font-size: 12.5px; }
.btn:hover { border-color: var(--accent); }
/* the download buttons float in the map's corner, so they take no height from the map */
.dl { position: absolute; top: 8px; right: 10px; z-index: 1; display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--muted); }
.dl .btn { padding: 2px 7px; font-size: 11.5px; }
#status { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); max-width: min(92vw, 640px); background: var(--ink); color: var(--surface); padding: 7px 13px; border-radius: 6px; font-size: 13px; z-index: 5; }
#status:empty { display: none; }
/* marks and notes */
.star { background: none; border: 0; cursor: pointer; font-size: 19px; line-height: 1; padding: 0 2px; color: var(--muted); }
.star[aria-pressed="true"], .mk { color: var(--mark); }
.star:hover { color: var(--mark); }
.mk { font-style: normal; margin-right: 4px; }
.chk { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12.5px; cursor: pointer; }
textarea { width: 100%; min-height: 58px; resize: vertical; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); font: inherit; font-size: 13px; color: inherit; }
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
#notes-tools { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
#notes td textarea { min-width: 220px; min-height: 46px; }
.tab .count { font-family: var(--mono); font-size: 11.5px; margin-left: 5px; color: var(--muted); }
/* tables */
table { border-collapse: separate; border-spacing: 0; font-size: 12.5px; }
th { position: sticky; top: 0; background: var(--surface); font-weight: 500; color: var(--muted); padding: 6px 4px; text-align: center; border-bottom: 1px solid var(--line); z-index: 1; white-space: nowrap; }
th.grp { font-size: 11px; letter-spacing: .05em; text-transform: uppercase; border-bottom: 0; padding-bottom: 0; }
td { padding: 0; }
td.g { padding: 3px 10px 3px 14px; white-space: nowrap; position: sticky; left: 0; background: var(--surface); }
td.g button { background: none; border: 0; padding: 0; cursor: pointer; font-style: italic; }
td.g button:hover { color: var(--accent); text-decoration: underline; }
td.c { width: 38px; min-width: 38px; height: 24px; text-align: center; font-family: var(--mono); font-size: 11.5px; border: 1px solid var(--surface); border-radius: 3px; }
td.gap { width: 12px; min-width: 12px; }
tr.sel td.g { background: var(--accent-soft); }
.wide td, .wide th { padding: 6px 10px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--line); }
.wide td { white-space: normal; max-width: 46ch; }
.wide th { text-align: left; }
.pad { padding: 4px 14px 14px; }
.pad h3 { font: 600 13px/1.3 var(--body); margin: 16px 0 6px; }
.pad p { color: var(--muted); margin: 4px 0 8px; max-width: 78ch; font-size: 12.5px; }
/* gene card */
#card { padding: 2px 14px 14px; }
#card h3 { font: 500 26px/1.1 var(--display); font-style: italic; margin: 2px 0 2px; }
#card h4 { font: 600 11px/1 var(--body); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); margin: 16px 0 6px; }
#card p { margin: 3px 0; font-size: 13px; }
.chip { display: inline-block; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); font-size: 12px; margin: 2px 4px 2px 0; background: var(--bg); }
button.chip { cursor: pointer; font-style: italic; }
button.chip:hover { border-color: var(--accent); }
.mini { width: 100%; }
.mini th { position: static; font-size: 11px; padding: 2px 3px; }
.mini td.l { padding: 2px 6px 2px 0; color: var(--muted); font-size: 12px; line-height: 1.2; }
.mini td.c { width: 30px; min-width: 26px; }
#card details { margin: 6px 0; font-size: 12px; }
#card summary { cursor: pointer; color: var(--muted); }
.mini td.na { background: none; color: var(--muted); }
.strow { display: grid; grid-template-columns: 54px minmax(0, 1fr) 30px 70px; gap: 6px; align-items: center; font-size: 12.5px; padding: 1px 0; }
.strow .bar { height: 8px; background: var(--zero); border-radius: 0 4px 4px 0; overflow: hidden; }
.strow .bar b { display: block; height: 100%; background: var(--accent); border-radius: 0 4px 4px 0; }
.strow small { color: var(--muted); font-size: 11px; }
.muted { color: var(--muted); }
@media (max-width: 980px) {
  html, body { height: auto; }
  main { grid-template-columns: minmax(0, 1fr); }
  #genes .scroll { max-height: 210px; }
  #stage { min-height: 380px; height: 60vw; flex: none; }
  nav { margin-left: 0; flex-wrap: wrap; }
  #doc { grid-template-columns: minmax(0, 1fr); gap: 14px; padding: 16px 14px 40px; }
  #doc #toc { position: static; columns: 2; }
}
</style>
</head>
<body>
<header>
  <h1>VMH neuropeptide atlas</h1>
  <p>Peptide precursors and receptors in the mouse ventromedial hypothalamus, by compartment and cell type</p>
  <nav aria-label="Views">
    <button class="tab" data-view="map">Map</button>
    <button class="tab" data-view="matrix">All genes</button>
    <button class="tab" data-view="sources">Ligand sources</button>
    <button class="tab" data-view="notes">Notes<span class="count" id="ncount"></span></button>
    <button class="tab doc" data-view="documentation">Documentation</button>
  </nav>
</header>
<main>
  <section class="panel" id="genes" aria-label="Genes">
    <h2>Genes</h2>
    <div id="gl-head">
      <div class="seg" id="kind" role="group" aria-label="Gene class">
        <button data-kind="ligand">Peptides</button><button data-kind="receptor">Receptors</button><button data-kind="context">Markers</button>
      </div>
      <input id="q" type="search" placeholder="Find a gene" aria-label="Find a gene">
      <label class="chk"><input type="checkbox" id="onlymarked"> Marked or annotated only</label>
      <div id="gl-key"><span class="dot"></span>measured in situ in the selected brain</div>
    </div>
    <div class="scroll" id="genelist"></div>
  </section>
  <section class="panel" id="view" aria-live="polite"></section>
  <section class="panel" id="detail" aria-label="Selected gene">
    <h2>Selected gene</h2>
    <div class="scroll"><div id="card"></div></div>
  </section>
</main>
<div id="status" role="status"></div>
<script src="data.js"></script>
<script src="doc.js"></script>
<script>
"use strict";
const $ = s => document.querySelector(s);
const el = (tag, attrs = {}, ...kids) => { const n = document.createElement(tag); for (const k in attrs) { if (k === 'text') n.textContent = attrs[k]; else if (k === 'html') n.innerHTML = attrs[k]; else if (k.startsWith('on')) n.addEventListener(k.slice(2), attrs[k]); else n.setAttribute(k, attrs[k]); } for (const k of kids) n.append(k); return n; };
const RAMP = { light: ['#e9eff8', '#cde2fb', '#86b6ef', '#3987e5', '#1c5cab', '#0d366b'], dark: ['#243242', '#1c4a80', '#256abf', '#3987e5', '#86b6ef', '#d8e8fc'] };
const COMP_COL = { light: ['#b9bcb6', '#2a78d6', '#eb6834', '#1baf7a', '#eda100', '#e87ba4', '#82778b'], dark: ['#555b57', '#3987e5', '#d95926', '#199e70', '#c98500', '#d55181', '#b7a6c4'] };
const ST_COL = { light: ['#c9ccc6', '#2a78d6', '#eb6834', '#1baf7a', '#eda100', '#6f7370', '#e87ba4', '#008300', '#6250d6', '#e34948'],
                 dark: ['#4a504c', '#3987e5', '#d95926', '#199e70', '#c98500', '#9a9f9b', '#d55181', '#0ca30c', '#9085e9', '#e66767'] };
const COMP_KEYS = ['outside', 'VMHDM', 'VMHC', 'VMHVL', 'VMH', 'VMHSh', 'no_ccf'];
const COMP_LABEL = { outside: 'outside VMH', VMHDM: 'dorsomedial', VMHC: 'central', VMHVL: 'ventrolateral', VMH: 'undivided ends', VMHSh: 'shell', no_ccf: 'unregistered' };
const COLS = ['DM', 'C', 'VL', 'ends', 'shell'];
const BRAIN_NAMES = { allen_m: 'Allen M', zhuang1_f: 'Zhuang 1 F', zhuang2_m: 'Zhuang 2 M' };
let DATA, S = { view: 'map', gene: 'Oxtr', kind: 'receptor', ds: 'allen_m', sec: 0, color: 'gene', est: 'measured', matrixBrain: 'mix', q: '', marked: false };

const theme = () => { const t = document.documentElement.getAttribute('data-theme'); return t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light'; };
const cssv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function hex(h) { return [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)); }
function ramp(t, th) {
  const r = RAMP[th || theme()], x = Math.max(0, Math.min(1, t)) * (r.length - 1), i = Math.min(r.length - 2, Math.floor(x)), f = x - i, a = hex(r[i]), b = hex(r[i + 1]);
  return `rgb(${a.map((v, k) => Math.round(v + (b[k] - v) * f)).join(',')})`;
}
function inkOn(t) { return (theme() === 'light') === (t >= 0.5) ? '#ffffff' : (theme() === 'light' ? '#14181a' : '#0d1114'); }
function b64(str, T) { const bin = atob(str), u8 = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i); return T === Uint8Array ? u8 : new T(u8.buffer); }
const G = () => DATA.genes[S.gene], B = () => DATA.brains[S.ds];
const fmt = v => v == null ? '' : (v >= 9.95 ? v.toFixed(0) : v.toFixed(1));

function save() { try { localStorage.setItem('vmh_np_explorer', JSON.stringify({ gene: S.gene, ds: S.ds, color: S.color })); } catch (e) {} }
function select(gene, keepKind) {
  if (!DATA.genes[gene]) return;
  S.gene = gene; if (!keepKind) S.kind = DATA.genes[gene].kind;
  save(); renderAll();
}

// ---------------------------------------------------------------- gene list
function renderGenes() {
  document.querySelectorAll('#kind button').forEach(b => b.setAttribute('aria-pressed', b.dataset.kind === S.kind));
  const q = S.q.toLowerCase();
  const rows = DATA.order.filter(g => DATA.genes[g].kind === S.kind && (!S.marked || N.genes[g]) && (!q || g.toLowerCase().includes(q) || (DATA.genes[g].what || '').toLowerCase().includes(q)))
    .map(g => [g, DATA.genes[g].proj.allen_m[DATA.comps.indexOf('core')] || 0]).sort((a, b) => b[1] - a[1]);
  const box = $('#genelist'), top = box.scrollTop; box.textContent = '';
  if (!rows.length) box.append(el('p', { class: 'muted', style: 'padding:6px 12px', text: S.marked ? 'No marked or annotated gene in this class.' : 'No gene matches.' }));
  for (const [g, v] of rows) {
    box.append(el('button', { class: 'gene', 'aria-pressed': g === S.gene, title: `${g}: ${fmt(v)}% of core neurons (projected, male brain)`, onclick: () => select(g, true) },
      el('span', {}, markOf(g), el('i', { text: g }), B().measured[g] ? el('span', { class: 'dot', title: 'Measured in situ in the selected brain' }) : ''), el('span', { class: 'bar' }, el('b', { style: `width:${Math.min(100, v)}%` })), el('span', { class: 'num', text: fmt(v) })));
  }
  box.scrollTop = top;
}

// ---------------------------------------------------------------- gene card
function heatCell(v, cls = 'c') {
  if (v == null) return el('td', { class: cls + ' na', text: '–', title: 'Estimate unavailable' });
  const t = v / 100;
  return el('td', { class: cls, style: `background:${v < 0.5 ? cssv('--zero') : ramp(t)};color:${v < 0.5 ? cssv('--muted') : inkOn(t)}`, text: v < 0.5 ? '' : fmt(v) });
}
function renderCard() {
  const g = G(), c = $('#card'); c.textContent = '';
  const kindName = { ligand: 'peptide precursor', receptor: 'receptor', context: 'marker' }[g.kind];
  c.append(el('div', { class: 'cardhead' }, el('h3', { text: S.gene }), starButton(S.gene)));
  c.append(el('p', {}, el('span', { class: 'chip', text: kindName }), g.family && g.kind !== 'context' ? el('span', { class: 'chip', text: g.family }) : '', g.tag && g.tag !== 'neuronal' ? el('span', { class: 'chip', text: g.tag }) : ''));
  if (g.what) c.append(el('p', {}, el('span', { class: 'muted', text: g.kind === 'ligand' ? 'Peptides: ' : g.kind === 'receptor' ? 'Principal coupling: ' : '' }), g.what));
  if (g.note) c.append(el('p', { class: 'muted', text: g.note }));
  if (g.pairNotes) c.append(el('p', { class: 'muted', text: g.pairNotes }));
  c.append(el('h4', { text: 'Your note' }), noteArea(S.gene));
  if (g.partners.length) {
    c.append(el('h4', { text: g.kind === 'ligand' ? 'Listed receptor genes and components' : 'Listed ligand genes' }));
    const p = el('p'); for (const x of g.partners) p.append(el('button', { class: 'chip', title: 'Show ' + x, text: x, onclick: () => select(x) })); c.append(p);

  const t2 = el('table', { class: 'wide' }, el('thead', {}, el('tr', {}, ...['Precursor', 'Peptides', 'VMH evidence', 'Listed receptors or components'].map(x => el('th', { text: x })))));
  const tb2 = el('tbody');
  DATA.order.filter(g => DATA.genes[g].kind === 'ligand' && DATA.genes[g].src && DATA.genes[g].src.local).forEach(g => { const d = DATA.genes[g];
    const cell = el('td'); d.partners.forEach(x => cell.append(el('button', { class: 'chip', text: x, onclick: () => select(x) }))); if (!d.partners.length) cell.textContent = 'none assigned';
    tb2.append(el('tr', {}, el('td', { class: 'g', style: 'position:static' }, el('button', { text: g, onclick: () => select(g) })), el('td', { text: d.what }), el('td', { text: peakEvidence(d.src) }), cell)); });
  t2.append(tb2); pad.append(t2);
  v.append(el('div', { class: 'scroll' }, pad));
}

function renderAll() {
  document.querySelectorAll('.tab[data-view]').forEach(b => b.setAttribute('aria-current', b.dataset.view === S.view ? 'page' : 'false'));
  renderGenes(); renderCard();
  $('main').classList.toggle('docmode', S.view === 'documentation');
  ({ map: renderMap, matrix: renderMatrix, sources: renderSources, notes: renderNotes, documentation: renderDoc })[S.view]();
}
function route() { const h = location.hash.replace('#', ''); S.view = ['map', 'matrix', 'sources', 'notes', 'documentation'].includes(h) ? h : 'map'; renderAll(); }

// ---------------------------------------------------------------- documentation (docs/doc.js, built by step 11)
function renderDoc() {
  const v = $('#view'); v.textContent = '';
  if (!window.__DOC__) { v.append(el('p', { style: 'padding:16px', text: 'The documentation could not be loaded: doc.js must sit in the same folder as this page.' })); return; }
  const box = el('div', { class: 'scroll' }, el('div', { id: 'doc', html: window.__DOC__ }));
  v.append(box);
  // the address hash names the view, so the contents list scrolls by script instead of by anchor
  box.querySelectorAll('[data-goto]').forEach(b => b.addEventListener('click', () => { const t = document.getElementById(b.dataset.goto); if (t) t.scrollIntoView({ block: 'start' }); }));
}

async function boot() {
  DATA = window.__DATA__;
  if (!DATA) { $('#view').append(el('p', { style: 'padding:16px', text: 'The atlas data could not be loaded: data.js must sit in the same folder as this page.' })); return; }
  for (const b of Object.values(DATA.brains)) {
    b.X = b64(b.x, Int16Array); b.Y = b64(b.y, Int16Array); b.CL = b64(b.cl, Uint16Array); b.ST = b64(b.st, Uint8Array); b.CP = b64(b.cp, Uint8Array);
    for (const m of Object.values(b.measured)) { m.V = b64(m.v, Uint8Array); m.aboveBits = b64(m.above, Uint8Array); }
  }
  DATA.P = {}; for (const g in DATA.projected) DATA.P[g] = b64(DATA.projected[g], Uint8Array);
  DATA.PS = b64(DATA.projSrc, Uint8Array);
  try { const s = JSON.parse(localStorage.getItem('vmh_np_explorer') || 'null'); if (s && DATA.genes[s.gene] && DATA.brains[s.ds]) { S.gene = s.gene; S.ds = s.ds; S.color = s.color || 'gene'; S.kind = DATA.genes[s.gene].kind; } } catch (e) {}
  loadNotes(); countNotes();
  S.sec = Math.floor(B().sections.length / 2);
  document.querySelectorAll('.tab[data-view]').forEach(b => b.addEventListener('click', () => { location.hash = b.dataset.view; if (S.view !== b.dataset.view) { S.view = b.dataset.view; renderAll(); } }));
  document.querySelectorAll('#kind button').forEach(b => b.addEventListener('click', () => { S.kind = b.dataset.kind; renderGenes(); if (S.view === 'matrix') renderMatrix(); }));
  $('#q').addEventListener('input', e => { S.q = e.target.value; renderGenes(); });
  $('#onlymarked').addEventListener('change', e => { S.marked = e.target.checked; renderGenes(); });
  addEventListener('hashchange', route);
  addEventListener('resize', () => { if (S.view === 'map') draw(frame.est); });
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', renderAll);
  new MutationObserver(renderAll).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  route();
}
boot();
</script>
</body>
</html>
